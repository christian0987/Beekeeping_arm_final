# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_group_controller:
  ros__parameters:
    joints:
      - robot_arm_base_turn
      - robot_arm_turn_joint
      - robot_arm_up_joint
      - robot_arm_front_joint
      - robot_arm_down_joint
      - robot_hand_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
gripper_group_controller:
  ros__parameters:
    joints:
      - finger_1_joint
      - finger_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity